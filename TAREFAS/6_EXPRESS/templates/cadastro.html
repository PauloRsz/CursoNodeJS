<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Usuário</h2>
        <p class="subtitle">Preencha os dados abaixo para criar uma nova conta</p>

        <form action="/users/save" method="post">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="name" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="usuario">Nome de Usuário</label>
                <input type="text" id="usuario" name="user" placeholder="Digite um nome de usuário único" required>
            </div>

            <div class="form-group">
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="age" placeholder="Digite sua idade" min="1" max="120" required>
            </div>
                <div class="form-group">
                <label for="imagem">FOTO DE PERFIL</label>
                <input type="file" id="image" name="profilePicture" placeholder="selecione uma foto" accept="image/*">
            </div>

            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>
    </div>
</body>
</html>
